name = "megapot-build"
pages_build_output_dir = "out"
# Required when wrangler.toml is the Pages source of truth. Without it,
# Git/Wrangler deploys ship static `out/` (Next 404.html) and never bind
# functions/go.js, so GET /go is 404 HTML instead of a Function 302.
compatibility_date = "2026-09-16"

# Factory identity. Not a secret. Pages project `megapot-build` must also
# bind SITE_HOSTNAME=megapot.build so Function Location matches HTML UTMs.
# Do not bind a Cloudflare account identifier here.
[vars]
SITE_HOSTNAME = "megapot.build"

# /go hit counts. Dataset is not a secret. Writes hostname + UTM medium/
# campaign + path + status only — never wallets, codes, Location, IPs, or cookies.
[[analytics_engine_datasets]]
binding = "GO_HITS"
dataset = "network_go_hits"
